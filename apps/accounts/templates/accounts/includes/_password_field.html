{% load i18n %}<div class="mb-3">
    <label for="{{ field.auto_id }}" class="form-label fw-medium">{{ label }}</label>
    <div class="input-group">
        <input type="password" name="{{ field.html_name }}" id="{{ field.auto_id }}" class="form-control" autocomplete="{{ autocomplete }}"{% if help or field.errors %} aria-describedby="{% if help %}{{ field.auto_id }}_helptext{% endif %}{% if help and field.errors %} {% endif %}{% if field.errors %}{{ field.auto_id }}_error{% endif %}"{% endif %}{% if field.errors %} aria-invalid="true"{% endif %}{% if autofocus %} autofocus{% endif %} required>
        <button type="button" class="btn password-toggle" data-password-toggle aria-controls="{{ field.auto_id }}" aria-pressed="false" aria-label="{% translate 'Show password' %}" title="{% translate 'Show password' %}"><i class="bi bi-eye" aria-hidden="true"></i></button>
    </div>
    {% if field.errors %}
    <div class="invalid-feedback d-block" id="{{ field.auto_id }}_error">
        {% for error in field.errors %}<div>{{ error }}</div>{% endfor %}
    </div>
    {% endif %}
    {% if help %}
    <div class="form-text password-rules" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
    {% endif %}
</div>
