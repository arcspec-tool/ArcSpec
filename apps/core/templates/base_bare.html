<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}ArcSpec{% endblock %}</title>
    {% load static compress %}
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    {% compress css file app %}
    <link href="{% static 'css/inter.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    {% endcompress %}
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <script src="{% url 'javascript-catalog' %}"></script>
    {% compress js file bare %}
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    {% block bundle_js %}{% endblock %}
    {% endcompress %}
    {% block extra_js %}{% endblock %}
</body>
</html>
