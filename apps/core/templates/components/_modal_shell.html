{% load i18n %}<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="{{ modal_id }}Label" aria-hidden="true" data-modal-name="{{ modal_name }}">
    <div class="modal-dialog modal-dialog-centered{% if modal_size %} modal-{{ modal_size }}{% endif %}{% if modal_scrollable %} modal-dialog-scrollable{% endif %}">
        <div class="modal-content">
            <div class="modal-header{% block header_class %}{% endblock %}">
                <h5 class="modal-title" id="{{ modal_id }}Label">{% block modal_title %}{% endblock %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'Close' %}"></button>
            </div>
            {% block after_header %}{% endblock %}
            <div class="modal-body{% block body_class %}{% endblock %}">{% block modal_body %}{% endblock %}</div>
            {% block footer_wrapper %}<div class="modal-footer{% block footer_class %}{% endblock %}">{% block modal_footer %}{% endblock %}</div>{% endblock %}
            {% block after_footer %}{% endblock %}
        </div>
    </div>
</div>
