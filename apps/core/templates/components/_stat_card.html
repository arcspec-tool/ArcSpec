<div class="card stat-card">
    <div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon bg-{{ icon_color }}-subtle text-{{ icon_color }}">
            <i class="bi {{ icon }}"></i>
        </div>
        <div>
            <div class="stat-value">{{ value }}</div>
            <div class="stat-label">{{ label }}</div>
        </div>
    </div>
</div>
