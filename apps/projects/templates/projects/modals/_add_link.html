{% extends "components/_modal_shell.html" %}
{% load i18n %}
{% block modal_title %}<i class="bi bi-link-45deg me-2"></i>{% translate "Add Traceability Link" %}{% endblock %}
{% block modal_body %}
                <div class="mb-3">
                    <label for="linkType" class="form-label">{% translate "Link Type" %}</label>
                    <select class="form-select" id="linkType">
                        {% for value, label in link_type_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="linkTargetSearch" class="form-label">{% translate "Target Item" %}</label>
                    <input type="text" class="form-control" id="linkTargetSearch" placeholder="{% translate 'Search by item ID or text...' %}" autocomplete="off">
                    <div id="linkTargetResults" class="mt-2" style="max-height: 200px; overflow-y: auto;"></div>
                    <input type="hidden" id="linkTargetId">
                </div>
{% endblock %}
{% block modal_footer %}<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% translate "Cancel" %}</button>
                <button type="button" class="btn btn-primary" id="addLinkSubmit">{% translate "Add Link" %}</button>{% endblock %}
